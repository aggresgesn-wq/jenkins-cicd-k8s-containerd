<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="1400" height="820" fill="#f8fafc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="40" y="48" font-size="27" font-weight="bold" fill="#0f172a">三节点 Kubernetes 运维实验 · Jenkins #53 真实构建链路</text>
<text x="40" y="78" font-size="16" fill="#475569">1 个集群 / 3 个节点 + 1 台 NFS/Gitea VM；实线为运行证据，虚线为待核实或待验收能力</text>
<rect x="35" y="112" width="310" height="100" rx="12" fill="#e2e8f0"/>
<text x="55" y="145" font-size="21" font-weight="bold">GitHub 展示仓库</text>
<text x="55" y="174" font-size="16">代码 · 模板 · 证据 · 运维手册</text>
<text x="55" y="196" font-size="14" fill="#475569">Gitee 为应用上游，平台间未证实自动同步</text>
<rect x="35" y="238" width="310" height="260" rx="12" fill="#eff6ff" stroke="#3b82f6"/>
<text x="55" y="272" font-size="21" font-weight="bold">独立服务虚拟机</text>
<rect x="55" y="291" width="270" height="77" rx="8" fill="#dbeafe"/>
<text x="72" y="322" font-size="19">Gitea · 内网应用仓库</text>
<text x="72" y="348" font-size="15">main / caa95a0…（#53）</text>
<rect x="55" y="388" width="270" height="86" rx="8" fill="#dbeafe"/>
<text x="72" y="419" font-size="19">NFS · 共享存储服务</text>
<text x="72" y="449" font-size="15">实际导出 / PVC 挂载待采集</text>
<rect x="35" y="531" width="310" height="116" rx="12" fill="#fef3c7" stroke="#d97706"/>
<text x="55" y="565" font-size="20" font-weight="bold">Jenkins Controller</text>
<text x="55" y="596" font-size="16">动态创建 Agent Pod</text>
<text x="55" y="624" font-size="14">Controller 部署位置待现场核实</text>
<rect x="420" y="112" width="940" height="535" rx="15" fill="#fff" stroke="#0f766e" stroke-width="2"/>
<text x="445" y="147" font-size="22" font-weight="bold" fill="#115e59">Kubernetes 单集群 · containerd 运行时</text>
<text x="445" y="176" font-size="15" fill="#475569">集群规模由用户确认；节点角色 / 版本 / 资源以资产清单为准</text>
<rect x="445" y="201" width="435" height="274" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
<text x="465" y="233" font-size="20" font-weight="bold">k8s-master · #53 构建调度节点</text>
<text x="465" y="266" font-size="17">动态 Agent：jenkins-agent namespace</text>
<text x="465" y="301" font-size="17">python + nerdctl + buildkitd + jnlp</text>
<path d="M660,313 L660,341" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="465" y="369" font-size="17">BuildKit OCI worker → 镜像导出</text>
<text x="465" y="404" font-size="17">nerdctl → 本地 containerd 镜像导入</text>
<text x="465" y="448" font-size="14" fill="#b45309">实验基线：特权 sidecar / 宿主机 socket</text>
<rect x="905" y="201" width="430" height="115" rx="10" fill="#f1f5f9"/>
<text x="930" y="238" font-size="20">节点 2</text>
<text x="930" y="275" font-size="16">主机名 / 角色 / 资源待记录</text>
<rect x="905" y="338" width="430" height="137" rx="10" fill="#f1f5f9"/>
<text x="930" y="377" font-size="20">节点 3</text>
<text x="930" y="414" font-size="16">主机名 / 角色 / 资源待记录</text>
<text x="930" y="448" font-size="14" fill="#475569">三节点不自动等于高可用</text>
<path d="M325,329 L445,329" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="354" y="313" font-size="14">检出</text>
<path d="M325,432 L420,432" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M345,570 L445,570 L445,490" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="490" y="508" width="300" height="105" rx="9" fill="#faf5ff" stroke="#9333ea" stroke-dasharray="6 5"/>
<text x="510" y="542" font-size="19">ACR 镜像推送 · 待验收</text>
<text x="510" y="577" font-size="15">#53 无 push 命令</text>
<path d="M790,560 L930,560" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="940" y="508" width="370" height="105" rx="9" fill="#faf5ff" stroke="#9333ea" stroke-dasharray="6 5"/>
<text x="960" y="542" font-size="19">K8s 发布 / readiness · 待验收</text>
<text x="960" y="577" font-size="15">#53 部署 stage 仅 echo</text>
<rect x="35" y="678" width="1325" height="108" rx="12" fill="#e2e8f0"/>
<text x="55" y="712" font-size="18" font-weight="bold">运维建设：资产清单 · 节点/Pod/PVC 巡检 · NFS/Gitea 备份恢复 · 故障演练</text>
<text x="55" y="742" font-size="16">NFS/Gitea VM 为共同故障点；备份需异机保存。#53 成功证明构建链路，不代表完整 CD 或恢复能力已验证。</text>
<text x="55" y="768" font-size="14" fill="#475569">加固候选入口：ci/Jenkinsfile.hardened（Rootless / 扫描 / digest / staging / 审批），须另行集群验收。</text>
</g></svg>
