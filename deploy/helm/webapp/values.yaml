# webapp Helm values
#
# 安装示例：
#   helm upgrade --install webapp deploy/helm/webapp -n webapp --create-namespace \
#     --set image.tag=$(git rev-parse --short HEAD) \
#     --set ingress.host=app.example.com
#
# 敏感配置（SECRET_KEY / DATABASE_URI / CAPTCHA_SECRET_KEY）不放在 values 中，
# 由预先创建的 Secret（默认 webapp-secret）注入。

replicaCount: 2

image:
  # 部署前替换为你的镜像仓库地址（命名空间用你自己的）
  repository: crpi-m67ogm8wgcr0rh38.cn-hangzhou.personal.cr.aliyuncs.com/REPLACE_ME/webapp
  # 留空则使用 Chart.appVersion；CI 发布时覆盖为 git short sha
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
# 固定资源名；Helm 管理的 release 仍只能通过 Helm 升级与回滚
fullnameOverride: "webapp"

serviceAccount:
  create: true
  name: ""
  automount: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

ingress:
  enabled: true
  className: nginx
  host: webapp.example.com
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/limit-rps: "20"
    # 指标端点在集群内抓取，公网通过 Ingress 一律拒绝
    nginx.ingress.kubernetes.io/server-snippet: |
      location = /metrics {
        deny all;
        return 403;
      }
  # webapp-tls 需要提前创建（cert-manager 或 kubectl create secret tls），Chart 不会自动生成
  tls:
    enabled: true
    secretName: webapp-tls

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 768Mi

# 非敏感环境变量（写入 ConfigMap）
config:
  FLASK_CONFIG: production
  LOG_LEVEL: INFO
  SESSION_LIFETIME_SECONDS: "28800"
  # 默认启用 TLS，因此 Cookie 必须只走 HTTPS；本地 http 调试时改为 "false"
  SESSION_COOKIE_SECURE: "true"
  MAX_CONTENT_LENGTH: "5242880"
  GUNICORN_WORKERS: "4"

# 已有 Secret 名称（需包含 SECRET_KEY / DATABASE_URI / CAPTCHA_SECRET_KEY）
existingSecret: webapp-secret

persistence:
  enabled: true
  accessModes:
    - ReadWriteMany
  size: 5Gi
  # storageClassName: ""
  mountPath: /app/uploads

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: webapp
