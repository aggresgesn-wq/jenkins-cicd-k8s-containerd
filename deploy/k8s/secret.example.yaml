# =============================================================================
# 示例 Secret：仅用于说明需要哪些键，请勿把真实密钥提交到仓库！
#
# 推荐直接用 kubectl 创建，而不是 apply 本文件：
#   kubectl -n webapp create secret generic webapp-secret \
#     --from-literal=SECRET_KEY="$(openssl rand -hex 32)" \
#     --from-literal=CAPTCHA_SECRET_KEY="$(openssl rand -hex 16)" \
#     --from-literal=DATABASE_URI='mysql+mysqlconnector://user:pass@mysql:3306/authbase?charset=utf8'
#
# 本文件故意没有被 kustomization.yaml 引用，避免 kubectl apply -k 用占位符覆盖线上真实 Secret。
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: webapp-secret
  namespace: webapp
  labels:
    app: webapp
    app.kubernetes.io/name: webapp
type: Opaque
stringData:
  # Flask 会话签名密钥，至少 32 字符：openssl rand -hex 32
  SECRET_KEY: "REPLACE_WITH_OPENSSL_RAND_HEX_32"

  # SQLAlchemy 连接串；密码中的 @ : / ? # % 等字符需要 URL 编码
  DATABASE_URI: "mysql+mysqlconnector://REPLACE_USER:REPLACE_PASSWORD@mysql.example.com:3306/authbase?charset=utf8"

  # Flask-Simple-Captcha 签名密钥：openssl rand -hex 16
  CAPTCHA_SECRET_KEY: "REPLACE_WITH_RANDOM_HEX_16"
