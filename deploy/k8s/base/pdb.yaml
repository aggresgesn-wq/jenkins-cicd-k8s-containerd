# 自愿中断（节点维护、drain、驱逐）时至少保留 1 个可用副本。
# 2 副本 + minAvailable 1：同一时间只允许中断 1 个 Pod。
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: webapp
  namespace: webapp
  labels:
    app: webapp
    app.kubernetes.io/name: webapp
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: webapp
