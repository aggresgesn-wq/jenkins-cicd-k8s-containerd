# 集群内访问入口：80 -> 容器 5000，供 Ingress 与同集群客户端使用。
apiVersion: v1
kind: Service
metadata:
  name: webapp
  namespace: webapp
  labels:
    app: webapp
    app.kubernetes.io/name: webapp
spec:
  type: ClusterIP
  selector:
    app: webapp
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 5000
